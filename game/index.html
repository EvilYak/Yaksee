<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#141210" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>THE MAGIC SHOP</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="crosshair"></div>

      <div id="hud">
        <div id="objective">
          <div id="objective-main">
            <span id="objective-icon">○</span>
            <span id="objective-text">Préparez-vous pour les clients</span>
          </div>
          <div id="objective-sub" class="hidden"></div>
        </div>
        <div id="money">💶 <span id="money-value">0</span> €</div>
        <div id="time">⏱ <span id="time-value">5:00</span></div>
        <button id="toggle-settings" class="toggle-btn" type="button">⚙</button>
      </div>

      <div id="interact-hint" class="hidden">
        <span class="key-badge">E</span>
        <span id="interact-label">Comptoir</span>
      </div>

      <div id="tool-hint" class="hidden">
        <span class="key-badge">🖱</span>
        <span id="tool-hint-label">Balayer</span>
      </div>

      <div id="npc-tag" class="hidden">
        <span>💬</span>
        <span id="npc-tag-name">Client</span>
        <span id="npc-tag-request"></span>
      </div>

      <div id="dialogue-box" class="hidden">
        <div id="dialogue-name">
          <span id="dialogue-icon">💬</span>
          <span id="dialogue-name-text">Client</span>
        </div>
        <div id="dialogue-text"></div>
        <div id="dialogue-next">▼</div>
      </div>

      <div id="settings-panel" class="hidden">
        <div id="settings-card">
          <div id="settings-title">RÉGLAGES</div>

          <div class="settings-row">
            <label for="sens-slider">Sensibilité de visée</label>
            <div class="settings-row-input">
              <input id="sens-slider" type="range" min="0.4" max="2.2" step="0.05" value="1" />
              <span id="sens-value">1.00×</span>
            </div>
          </div>

          <div class="settings-row">
            <label for="invert-y-toggle">Inverser l'axe Y</label>
            <button id="invert-y-toggle" class="toggle-btn" type="button">NON</button>
          </div>

          <button id="settings-close" type="button">FERMER</button>
        </div>
      </div>

      <div id="register-panel" class="hidden">
        <div id="register-card">
          <div id="register-title">CAISSE</div>
          <div id="register-money">💶 <span id="register-money-value">0</span> €</div>
          <div class="panel-section-title">Client</div>
          <div id="register-order"></div>
          <div class="panel-section-title">Stock</div>
          <div id="register-stock"></div>
          <div class="panel-section-title">Décoration</div>
          <div id="register-decor"></div>
          <button id="register-close" type="button">FERMER</button>
        </div>
      </div>

      <div id="trash-panel" class="hidden">
        <div id="trash-card">
          <div id="trash-title">POUBELLE</div>
          <div class="panel-section-title">Jeter un objet</div>
          <div id="trash-list"></div>
          <button id="trash-close" type="button">FERMER</button>
        </div>
      </div>

      <div id="closet-panel" class="hidden">
        <div id="closet-card">
          <div id="closet-title">PLACARD DE MÉNAGE</div>
          <div id="closet-current"></div>
          <div id="closet-list"></div>
          <button id="closet-close" type="button">FERMER</button>
        </div>
      </div>

      <div id="shift-end" class="hidden">
        <div id="shift-end-card">
          <div id="shift-end-title">APRÈS-MIDI TERMINÉ</div>
          <div id="shift-end-stats">
            <div>💶 <span id="shift-end-money">0</span> € encaissés</div>
            <div><span id="shift-end-served">0</span> client(s) servi(s)</div>
          </div>
          <button id="shift-end-restart" type="button">RECOMMENCER</button>
        </div>
      </div>

      <div id="boot-screen">
        <svg id="boot-logo" viewBox="0 0 120 90" aria-hidden="true">
          <!-- Chapeau haut-de-forme : bord + calotte, silhouette noire classique de magicien. -->
          <ellipse cx="52" cy="66" rx="34" ry="7" fill="#0a0a08" />
          <rect x="30" y="20" width="44" height="42" rx="2" fill="#0a0a08" />
          <rect x="30" y="52" width="44" height="7" fill="#d4af37" />
          <!-- Baguette croisée par-dessus le chapeau, étoile dorée à la pointe. -->
          <line x1="16" y1="34" x2="92" y2="10" stroke="#2a1810" stroke-width="4" stroke-linecap="round" />
          <line x1="80" y1="14" x2="92" y2="10" stroke="#d4af37" stroke-width="4" stroke-linecap="round" />
          <g fill="#d4af37">
            <circle cx="100" cy="7" r="3" />
            <circle cx="14" cy="40" r="2" />
            <circle cx="88" cy="24" r="2.2" />
          </g>
        </svg>
        <div id="boot-title">THE MAGIC SHOP</div>
        <div id="boot-subtitle">everything's an illusion.</div>
        <button id="start-btn">ENTRER</button>
      </div>

      <div id="touch-ui">
        <div id="joystick-zone">
          <div id="joystick-base">
            <div id="joystick-nub"></div>
          </div>
        </div>
        <div id="look-zone"></div>
        <button id="touch-jump" type="button">⤒</button>
        <button id="touch-interact" class="hidden" type="button">E</button>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
