<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a08" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>NO CLIP // backrooms</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="hud">
        <div id="rec">
          <span id="rec-dot"></span>
          <span>REC</span>
        </div>
        <div id="timestamp">00:00:00:00</div>
        <div id="battery">🔋 87%</div>
        <div id="toggles">
          <button id="toggle-vhs" class="toggle-btn active" type="button">VHS</button>
          <button id="toggle-lamp" class="toggle-btn active" type="button">💡</button>
          <button id="toggle-settings" class="toggle-btn" type="button">⚙</button>
        </div>
      </div>

      <div id="settings-panel" class="hidden">
        <div id="settings-card">
          <div id="settings-title">RÉGLAGES</div>

          <div class="settings-row">
            <label for="sens-slider">Sensibilité de visée</label>
            <div class="settings-row-input">
              <input id="sens-slider" type="range" min="0.4" max="2.2" step="0.05" value="1" />
              <span id="sens-value">1.00×</span>
            </div>
          </div>

          <div class="settings-row">
            <label for="invert-y-toggle">Inverser l'axe Y</label>
            <button id="invert-y-toggle" class="toggle-btn" type="button">NON</button>
          </div>

          <button id="settings-close" type="button">FERMER</button>
        </div>
      </div>

      <div id="boot-screen">
        <div id="boot-title">NO CLIP</div>
        <button id="start-btn">ENTRER</button>
      </div>

      <div id="touch-ui">
        <div id="joystick-zone">
          <div id="joystick-base">
            <div id="joystick-nub"></div>
          </div>
        </div>
        <div id="look-zone"></div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
